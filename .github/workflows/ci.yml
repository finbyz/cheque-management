name: CI

on:
  push:
    branches:
      - version-16
  pull_request:

concurrency:
  group: version-16-cheque_management-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379

      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379

      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Linux Dependencies
        run: |
          sudo apt update

          sudo apt install -y \
            mariadb-client \
            redis-tools \
            xvfb \
            libfontconfig1 \
            wkhtmltopdf \
            curl

      - name: Install Bench
        run: |
          python -m pip install --upgrade pip
          pip install frappe-bench

      - name: Initialize Bench
        run: |
          bench init \
            --frappe-branch version-16 \
            --skip-redis-config-generation \
            --skip-assets \
            --python python3 \
            ~/frappe-bench

      - name: Configure MariaDB
        run: |
          mariadb -h 127.0.0.1 -P 3306 -u root -proot \
          -e "SET GLOBAL character_set_server = 'utf8mb4';"

          mariadb -h 127.0.0.1 -P 3306 -u root -proot \
          -e "SET GLOBAL collation_server = 'utf8mb4_unicode_ci';"

      - name: Install App
        working-directory: /home/runner/frappe-bench
        env:
          CI: "Yes"
        run: |
          bench get-app cheque_management $GITHUB_WORKSPACE

          bench setup requirements --dev

          bench new-site test_site \
            --db-root-password root \
            --admin-password admin \
            --no-mariadb-socket

          bench --site test_site install-app cheque_management

      - name: Run Tests
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site test_site set-config allow_tests true

          bench --site test_site run-tests --app cheque_management
